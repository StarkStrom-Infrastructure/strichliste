# Builds the production stage of upstream strichliste-backend at the release in upstream.env and pushes it to GHCR.
# Pull requests only build. A monthly run rebuilds the same release to pick up fixes in the FrankenPHP base image.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strichliste

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read upstream release
        id: upstream
        run: |
          . ./upstream.env
          echo "version=${STRICHLISTE_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${STRICHLISTE_VERSION#v}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "tag=$STRICHLISTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$STRICHLISTE_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strichliste/strichliste-backend
          ref: ${{ steps.upstream.outputs.tag }}
          path: src
          persist-credentials: false

      - name: Check that the tag is the pinned commit
        run: test "$(git -C src rev-parse HEAD)" = "${{ steps.upstream.outputs.commit }}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=${{ steps.upstream.outputs.minor }}
          labels: |
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.commit }}
            org.opencontainers.image.licenses=MIT

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          target: frankenphp_prod
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
