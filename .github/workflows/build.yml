# Builds the production stage of upstream strichliste-backend at the release in upstream.env and pushes it to GHCR.
# Pull requests only build. A daily run rebuilds the same release without cache and publishes it only if the
# published image has pending Debian package upgrades that the fresh build has fewer of, or was built from
# another FrankenPHP base image than the upstream Dockerfile names now; otherwise the digests of the published
# tags stay as they are. A rebuild adds an unchanged <version>-rN tag; <version> and <major>.<minor> follow.
# Published images carry BuildKit provenance, an SBOM and a signed build provenance attestation.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if nothing changed
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strichliste

jobs:
  build:
    runs-on: ubuntu-latest
    # Two runs probing the same -rN would overwrite each other's tag.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read upstream release
        id: upstream
        run: |
          . ./upstream.env
          echo "version=${STRICHLISTE_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${STRICHLISTE_VERSION#v}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "tag=$STRICHLISTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$STRICHLISTE_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strichliste/strichliste-backend
          ref: ${{ steps.upstream.outputs.tag }}
          path: src
          persist-credentials: false

      - name: Check that the tag is the pinned commit
        run: test "$(git -C src rev-parse HEAD)" = "${{ steps.upstream.outputs.commit }}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="${IMAGE,,}"  # registry names are lowercase
          # The base image of the final stage and its current digest.
          base_ref=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' src/Dockerfile | head -n1)
          base_digest=$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}')
          case "$base_digest" in sha256:*) ;; *) echo "No digest for $base_ref: $base_digest" >&2; exit 1 ;; esac
          build=true push=false no_cache=false pending_only=

          case "$EVENT" in
            pull_request)
              ;;
            push)
              push=true
              ;;
            workflow_dispatch | schedule)
              no_cache=true
              if [ "$FORCE" = true ]; then
                echo "Forced"
                push=true
              elif ! out=$(docker pull --quiet --platform linux/amd64 "$IMAGE:$VERSION" 2>&1); then
                if grep -qiE 'not found|manifest unknown' <<< "$out"; then
                  echo "Nothing published for $VERSION yet"
                  push=true
                else
                  echo "Cannot pull $IMAGE:$VERSION: $out" >&2
                  exit 1
                fi
              else
                # A failing "apt-get update" or "docker run" must not look like "nothing pending".
                upgrade=$(docker run --rm --platform linux/amd64 --user 0 --entrypoint sh "$IMAGE:$VERSION" \
                  -c 'apt-get -qq --error-on=any update >/dev/null && apt-get -s upgrade') || exit 1
                pending=$(grep -c '^Inst ' <<< "$upgrade" || true)
                built_from=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$IMAGE:$VERSION")
                echo "Pending upgrades: $pending"
                echo "Base digest: published ${built_from:-none}, now $base_digest"
                if [ "$pending" -gt 0 ] || [ "$built_from" != "$base_digest" ]; then
                  push=true
                  # Only the pending upgrades call for it: the fresh build must have fewer.
                  [ "$built_from" != "$base_digest" ] || pending_only=$pending
                else
                  echo "up to date"
                fi
              fi
              [ "$push" = true ] || build=false
              ;;
          esac

          {
            echo "build=$build"
            echo "push=$push"
            echo "no_cache=$no_cache"
            echo "pending_only=$pending_only"
            echo "base_name=${base_ref%@*}"
            echo "base_digest=$base_digest"
          } >> "$GITHUB_OUTPUT"

      # A scheduled or manual build ignores the cache: a cached apt layer
      # would carry old packages. Its layers go into the cache for the publish
      # build below. Loaded into the local daemon, which cannot hold
      # attestations: no provenance here, the published build has it.
      - name: Build for the check
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          target: frankenphp_prod
          pull: true
          load: true
          tags: strichliste:fresh
          no-cache: ${{ steps.decide.outputs.no_cache == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The Dockerfile does not upgrade packages itself, so a fresh build has
      # the same pending upgrades as the published image while Debian is ahead
      # of the base image. Publishing then would add a tag every day without a
      # change: publish for pending upgrades only if the fresh build has fewer.
      - name: Compare pending upgrades
        id: fresh
        if: steps.decide.outputs.build == 'true'
        env:
          PUSH: ${{ steps.decide.outputs.push }}
          PENDING_ONLY: ${{ steps.decide.outputs.pending_only }}
        run: |
          if [ "$PUSH" = true ] && [ -n "$PENDING_ONLY" ]; then
            upgrade=$(docker run --rm --user 0 --entrypoint sh strichliste:fresh \
              -c 'apt-get -qq --error-on=any update >/dev/null && apt-get -s upgrade')
            fresh=$(grep -c '^Inst ' <<< "$upgrade" || true)
            echo "Pending upgrades: published $PENDING_ONLY, fresh build $fresh"
            if [ "$fresh" -ge "$PENDING_ONLY" ]; then
              echo "Not fewer; not publishing"
              PUSH=false
            fi
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

      # The first unused <version>-rN, found by asking the registry. Only a
      # "not found" answer means the tag is free (for -r1 also "name unknown"
      # or "denied": GHCR's answer while the package does not exist yet); any
      # other error fails the job rather than risk overwriting an immutable tag.
      - name: Rebuild number
        id: rebuild
        if: steps.fresh.outputs.push == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="${IMAGE,,}"
          n=1
          while true; do
            if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION-r$n" 2>&1); then
              n=$((n + 1))
            elif grep -qiE 'not found|manifest unknown' <<< "$out"; then
              break
            elif [ "$n" = 1 ] && grep -qiE 'name unknown|denied' <<< "$out"; then
              break
            else
              echo "Cannot probe $IMAGE:$VERSION-r$n: $out" >&2
              exit 1
            fi
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=${{ steps.upstream.outputs.minor }}
            type=raw,value=${{ steps.upstream.outputs.version }}-r${{ steps.rebuild.outputs.n }},enable=${{ steps.fresh.outputs.push == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=${{ steps.decide.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.decide.outputs.base_digest }}

      - id: push
        if: steps.fresh.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          target: frankenphp_prod
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - id: image
        if: steps.fresh.outputs.push == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.fresh.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
